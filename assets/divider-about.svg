<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="img" aria-label="01 // BOOT LOG">
<title>01 // BOOT LOG</title>
<defs>
  <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".5" stop-color="#00f0ff"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
  </linearGradient>
  <filter id="neon"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<line x1="0" x2="900" y1="20" y2="20" stroke="#00f0ff" stroke-opacity=".25"/>
<rect x="-160" y="18.5" width="160" height="3" fill="url(#pulse)" filter="url(#neon)">
  <animate attributeName="x" values="-160;900" dur="3.2s" repeatCount="indefinite"/>
</rect>
<rect x="320.0" y="6" width="260" height="28" rx="4" fill="#03050b" stroke="#00f0ff" stroke-opacity=".5"/>
<text x="450.0" y="25" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#00f0ff" letter-spacing="4">01 // BOOT LOG</text>
<circle cx="334.0" cy="20" r="3" fill="#ff2bd6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<circle cx="566.0" cy="20" r="3" fill="#ff2bd6"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></circle>
</svg>
