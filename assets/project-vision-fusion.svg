<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" role="img" aria-label="VISION-FUSION — Modular real-time CV — YOLOv8, face detection, motion analysis, CNN classification. One pipeline.">
<title>VISION-FUSION — Modular real-time CV — YOLOv8, face detection, motion analysis, CNN classification. One pipeline.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03050b"/><stop offset="1" stop-color="#0a1022"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#8a5cff"/>
    <stop offset="1" stop-color="#ff2bd6"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#00f0ff" stroke-opacity=".06"/>
  </pattern>
  <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="900" height="128" rx="16"/></clipPath></defs>
<g clip-path="url(#frame)">
  <rect width="900" height="128" fill="url(#bg)"/>
  <rect width="900" height="128" fill="url(#grid)"/>
  <rect width="104" height="128" fill="#03050b" fill-opacity=".8"/>
  <line x1="104" x2="104" y1="0" y2="128" stroke="#00f0ff" stroke-opacity=".3"/>
  <g transform="translate(52 64.0)" fill="none" stroke="#00f0ff" stroke-width="1.6">
      <rect x="-26" y="-26" width="52" height="52" stroke-dasharray="14 24" stroke-dashoffset="7"/>
      <circle r="16" stroke="#ff2bd6" stroke-dasharray="25 75"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#00f0ff"/>
      <rect x="-30" y="-30" width="60" height="60" stroke-opacity=".4"><animate attributeName="stroke-opacity" values=".1;.8;.1" dur="2s" repeatCount="indefinite"/></rect>
    </g>
  <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="128" y="38" font-size="11" fill="#6b7c9e" letter-spacing="3">MODULE_01</text>
    <text x="236" y="38" font-size="18" font-weight="800" fill="#d7e3ff" letter-spacing="2">VISION-FUSION</text>
    <text x="128" y="66" font-size="13" fill="#a9b7d6">Modular real-time CV — YOLOv8, face detection, motion analysis, CNN classification. One pipeline.</text>
    <g font-size="11"><rect x="128" y="86" width="63" height="22" rx="11" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".4"/><text x="160" y="101" text-anchor="middle" fill="#00f0ff">YOLOv8</text><rect x="199.2" y="86" width="63" height="22" rx="11" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".4"/><text x="231" y="101" text-anchor="middle" fill="#00f0ff">OpenCV</text><rect x="270.4" y="86" width="70" height="22" rx="11" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".4"/><text x="306" y="101" text-anchor="middle" fill="#00f0ff">PyTorch</text></g>
    <text x="868" y="101" font-size="13" font-weight="700" fill="#ff2bd6" text-anchor="end" letter-spacing="2">ACCESS REPO ›
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></text>
  </g>
  <rect x="0" y="-6" width="900" height="3" fill="#00f0ff" opacity=".10">
    <animate attributeName="y" values="-6;134" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="899" height="127" rx="16" fill="none" stroke="#00f0ff" stroke-opacity=".28"/>
<path d="M8 30V8H30 M870 8H892V30 M892 98V120H870 M30 120H8V98" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#soft)">
  <animate attributeName="stroke-opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/>
</path>
</svg>
